name: x_immich_uploader

services:
  x_immich_uploader:
    build: .
    ports:
      - "${APP_PORT:-8765}:${APP_PORT:-8765}"
    environment:
      APP_PORT: ${APP_PORT:-8765}
      IMMICH_URL: ${IMMICH_URL}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      X_COOKIES_FILE: ${X_COOKIES_FILE:-}
    volumes:
      - ${X_COOKIES_PATH:-./cookies.txt}:/run/secrets/x-cookies.txt:ro
    restart: unless-stopped
    networks:
      - default
      - proxy_network

networks:
  proxy_network:
    external: true
  default: